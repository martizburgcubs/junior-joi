<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Junior JOI Admin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="assets/joi-logo.png" alt="Junior JOI logo">
      <div><strong>JUNIOR JOI ADMIN</strong><small>Private organiser dashboard</small></div>
    </div>
    <a href="index.html" style="color:white">Public site</a>
  </header>

  <main class="admin-wrap">
    <section id="login-card" class="admin-card">
      <h1>Admin Login</h1>
      <div class="form">
        <label>Email<input id="email" type="email"></label>
        <label>Password<input id="password" type="password"></label>
        <div style="align-self:end"><button id="login" class="btn btn-primary">Sign In</button></div>
      </div>
      <p id="login-msg" class="muted"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="admin-card">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
          <h1>Control Centre</h1>
          <button id="logout" class="btn btn-dark">Sign Out</button>
        </div>
      </div>

      <div class="admin-card">
        <h2>Announcement</h2>
        <div class="form">
          <label class="full">Message<textarea id="announcement-message" rows="3"></textarea></label>
          <div><button id="save-announcement" class="btn btn-primary">Publish Announcement</button></div>
        </div>
      </div>

      <div class="admin-card">
        <h2>Add or Edit Fixture</h2>
        <input id="fixture-id" type="hidden">
        <div class="form">
          <label>Division<select id="division"><option>U14</option><option>U15</option></select></label>
          <label>Game Number<input id="game-number" type="number"></label>
          <label>Date<input id="match-date" type="date" value="2026-10-01"></label>
          <label>Time<input id="match-time" type="time"></label>
          <label>Venue<select id="venue"><option>APH 1</option><option>APH 2</option><option>GHS 1</option><option>GHS 2</option></select></label>
          <label>Pool<select id="pool"></select></label>
          <label>Home Team<select id="home-team"></select></label>
          <label>Away Team<select id="away-team"></select></label>
          <label>Home Score<input id="home-score" type="number" min="0"></label>
          <label>Away Score<input id="away-score" type="number" min="0"></label>
          <label>Status<select id="status"><option>Scheduled</option><option>Live</option><option>Completed</option><option>Postponed</option><option>Cancelled</option></select></label>
          <label>Stage<input id="stage" value="Pool"></label>
          <label class="full">Notes<textarea id="notes"></textarea></label>
          <div><button id="save-fixture" class="btn btn-primary">Save Fixture</button> <button id="clear-form" class="btn btn-dark">Clear</button></div>
        </div>
      </div>

      <div class="admin-card">
        <h2>Fixtures</h2>
        <div id="admin-fixtures"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
